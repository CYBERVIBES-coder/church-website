<style>
:root{--bg:#FBF8F1;--ink:#1F2430;--mute:#5A6070;--navy:#17223B;--gold:#8A6A1F;--goldl:#B8923A;--card:#fff;--line:#E6DFCE;--soft:#F3EEE1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181F;--ink:#ECE7DA;--mute:#A9AEBB;--gold:#D4B25E;--goldl:#D4B25E;--card:#1C212B;--line:#2E3442;--soft:#1A1F29}}
:root[data-theme="dark"]{--bg:#14181F;--ink:#ECE7DA;--mute:#A9AEBB;--gold:#D4B25E;--goldl:#D4B25E;--card:#1C212B;--line:#2E3442;--soft:#1A1F29}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;line-height:1.15;margin:0 0 .5em;font-weight:600;letter-spacing:.01em}
h1{font-size:clamp(2.2rem,6vw,4rem)}h2{font-size:clamp(1.7rem,4vw,2.5rem)}h3{font-size:1.45rem}
p{margin:0 0 1em;max-width:62ch}a{color:inherit}
:focus-visible{outline:3px solid var(--goldl);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--navy);color:#fff;padding:10px 14px;z-index:99}.skip:focus{left:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 12px rgba(0,0,0,.18)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:1.02rem;line-height:1.1;letter-spacing:.03em;text-transform:uppercase}
.mark{width:38px;height:38px;border:1.5px solid var(--goldl);border-radius:50%;display:grid;place-items:center;color:var(--goldl);flex:none}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:2px;align-items:center}
nav a{display:block;padding:10px 11px;text-decoration:none;font-size:.95rem;border-radius:6px}
nav a:hover,nav a[aria-current=page]{color:var(--goldl)}
.btn{display:inline-block;padding:14px 26px;min-height:48px;border-radius:6px;background:var(--goldl);color:#1A1608;text-decoration:none;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.88rem;border:1.5px solid var(--goldl);cursor:pointer;transition:background .2s,color .2s,transform .2s;font-family:inherit}
.btn:hover{background:transparent;color:var(--goldl)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}.btn.ghost:hover{background:rgba(255,255,255,.12);color:inherit}
.btn.dk{background:var(--navy);border-color:var(--navy);color:#fff}.btn.dk:hover{background:transparent;color:var(--ink)}
.menu{display:none;background:none;border:1.5px solid rgba(255,255,255,.4);color:#fff;width:48px;height:48px;border-radius:6px;font-size:1.4rem;cursor:pointer}
@media(max-width:1020px){.menu{display:block}nav{position:absolute;left:0;right:0;top:100%;background:var(--navy);max-height:0;overflow:hidden;transition:max-height .35s ease}nav.open{max-height:90vh;overflow:auto}nav ul{flex-direction:column;align-items:stretch;padding:8px 20px 20px}nav a{padding:16px 8px;font-size:1.1rem;border-bottom:1px solid rgba(255,255,255,.12)}}
.hero{background:radial-gradient(ellipse at 70% 20%,#3A3120 0,transparent 55%),linear-gradient(160deg,#1B2747,#0F172B);color:#fff;padding:clamp(56px,10vw,120px) 0 64px;position:relative}
.hero .sub{font-size:1.25rem;max-width:40ch;opacity:.92}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}
.svcbox{border-left:3px solid var(--goldl);padding:4px 0 4px 18px;margin-top:8px}
.svcbox b{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.3rem;letter-spacing:.06em}
.scroll{display:block;margin:40px auto 0;width:26px;height:42px;border:2px solid rgba(255,255,255,.5);border-radius:14px;position:relative}.scroll::after{content:"";position:absolute;left:10px;top:8px;width:4px;height:8px;border-radius:2px;background:#fff;animation:dot 2s infinite}
@keyframes dot{50%{transform:translateY(12px);opacity:.3}}
.fade{animation:fade .8s ease both}@keyframes fade{from{opacity:0;transform:translateY(10px)}}
section{padding:clamp(48px,7vw,88px) 0}.alt{background:var(--soft)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.split{display:grid;gap:36px;grid-template-columns:1.1fr 1fr;align-items:center}@media(max-width:800px){.split{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:0 2px 10px rgba(30,25,10,.06)}
.card h3{margin-bottom:.3em}.card p{color:var(--mute);margin-bottom:.6em}
.ph{background:linear-gradient(135deg,#C9A98A,#8C6B50 55%,#4A3A2E);border-radius:10px;min-height:280px;display:grid;place-items:center;color:#fff;text-align:center;padding:20px;font-size:.9rem}
.ph.tall{min-height:380px}.ph small{opacity:.9;max-width:26ch;display:block}
.tag{display:inline-block;font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--mute);margin:0 6px 6px 0}
.ph-txt{color:var(--gold);font-style:italic}
.page{padding:clamp(40px,6vw,72px) 0 20px;background:var(--navy);color:#fff}.page p{opacity:.9}
label{display:block;font-weight:600;margin:16px 0 6px}
input,textarea,select{width:100%;font:inherit;padding:13px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-height:48px}
textarea{min-height:140px}.err{color:#B3261E;font-size:.9rem;min-height:1.2em}@media(prefers-color-scheme:dark){.err{color:#FF8A80}}
.ok{background:var(--soft);border:1px solid var(--goldl);border-radius:8px;padding:14px;margin-top:16px}
.hp{position:absolute;left:-9999px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.empty{text-align:center;padding:48px 20px;border:1.5px dashed var(--line);border-radius:10px}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:600}.dot{width:10px;height:10px;border-radius:50%;background:#8A8F9C}
.stream{aspect-ratio:16/9;background:#101522;color:#fff;border-radius:10px;display:grid;place-items:center;text-align:center;padding:20px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}.filters input,.filters select{flex:1 1 180px}
.map{border:0;width:100%;height:clamp(280px,50vw,420px);border-radius:10px;background:var(--soft)}
footer{background:var(--navy);color:#fff;padding:56px 0 28px}footer a{text-decoration:none;opacity:.85}footer a:hover{opacity:1;color:var(--goldl)}
footer ul{list-style:none;padding:0;margin:0}footer li{margin:6px 0}
.fb{border-top:1px solid rgba(255,255,255,.18);margin-top:32px;padding-top:20px;font-size:.85rem;opacity:.8}
.tbl{overflow-x:auto}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
/* ====== EDITABLE CONTENT: change values here; everything on the site reads from this block ====== */
const C={
 name:"CHRIST-LIKE EVANGELISTIC MINISTRY",pastor:"Pastor Ernest Afgbedzi",
 time:"3:30 PM – 5:30 PM",day:"Every Sunday",
 addr:["The Pavilion","Selby Center","Selby Road","Tottenham","N17 8JL","United Kingdom"],
 phones:["+44 7494 735161","+44 7482 447160"],
 email:"[Church email address]",
 tagline:"Encounter Christ. Grow in Faith. Live His Love.",
 social:{Facebook:"",Instagram:"",YouTube:"",TikTok:""}, /* add official URLs to show a link */
 intro:"Christ-Like Evangelistic Ministry exists to proclaim the message of Jesus Christ, encourage believers in their faith, and reach people with the love and hope of the Gospel.",
 story:"[Add the history and story of Christ-Like Evangelistic Ministry here.]",
 mission:"[Add the official mission statement here.]",vision:"[Add the official vision statement here.]",
 bio:"[Add Pastor Ernest Afgbedzi's official biography, ministry journey, calling, and message here.]",
 message:"[Add a message from Pastor Ernest Afgbedzi here.]",
 values:[["Faith","Growing in a relationship with God through faith in Jesus Christ."],["Love","Demonstrating Christ's love through our words and actions."],["Prayer","Seeking God through prayer and dependence on Him."],["The Word","Learning and applying the teachings of Scripture."],["Evangelism","Sharing the message of Christ with others."],["Service","Serving God and people with humility and compassion."]],
 extraServices:[["Bible Study"],["Prayer Meeting"],["Special Services"]],
 topics:["Faith","Prayer","Evangelism","Christian Living","Hope","Family","Spiritual Growth","The Gospel"],
 sermons:[ /* title, speaker, date (YYYY-MM-DD), scripture, topic, description, videoUrl, audioUrl */
  {title:"[Sermon title]",speaker:"[Speaker]",date:"2026-01-01",scripture:"[Scripture reference]",topic:"Faith",desc:"[Add sermon description.]",video:"",audio:""},
  {title:"[Sermon title]",speaker:"[Speaker]",date:"2026-01-08",scripture:"[Scripture reference]",topic:"Prayer",desc:"[Add sermon description.]",video:"",audio:""},
  {title:"[Sermon title]",speaker:"[Speaker]",date:"2026-01-15",scripture:"[Scripture reference]",topic:"Hope",desc:"[Add sermon description.]",video:"",audio:""}],
 eventCats:["Worship","Prayer","Evangelism","Youth","Bible Study","Outreach","Conferences","Community"],
 events:[], /* {title,date,time,location,cat,desc,register:"url"} — leave empty to show the empty state */
 ministries:["Men's Ministry","Women's Ministry","Youth Ministry","Children's Ministry","Prayer Ministry","Evangelism","Worship Ministry","Outreach Ministry"].map(n=>({name:n,desc:"[Add description]",leader:"[Leader]",schedule:"[Meeting schedule]",contact:"[Contact information]"})),
 giving:[["Online Giving","[Add payment provider]"],["Bank Transfer","[Add official bank information]"],["Mobile Payment","[Add official payment information]"],["In-Person Giving","[Add information]"]],
 liveUrl:"" /* paste a YouTube/Facebook embed URL here only when a service is actually live */
};
const addrLine=C.addr.slice(0,5).join(", ");
const dirUrl="https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(C.addr.join(", "));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tel=p=>`<a href="tel:${p.replace(/\s/g,"")}">${p}</a>`;
const nav=[["","Home"],["about","About Us"],["services","Services"],["sermons","Sermons"],["events","Events"],["ministries","Ministries"],["prayer","Prayer"],["give","Give"],["contact","Contact"]];
const ph=(t,c="")=>`<div class="ph ${c}" role="img" aria-label="Photo placeholder: ${esc(t)}"><small>Photo placeholder<br>${esc(t)}</small></div>`;
const svc=()=>`<div class="card"><h3>Sunday Worship</h3><p><b>${C.day}</b><br>${C.time}</p><p>${C.addr.slice(0,5).join("<br>")}</p><div class="row"><a class="btn dk" href="${dirUrl}" target="_blank" rel="noopener">Get directions</a><a class="btn ghost" href="#/contact">Contact us</a></div></div>`;
const head=(h,p)=>`<div class="page"><div class="wrap"><h1>${h}</h1>${p?`<p>${p}</p>`:""}</div></div>`;
const empty=(t,p)=>`<div class="empty"><h3>${t}</h3><p style="margin:0 auto">${p}</p></div>`;
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});

function upcoming(){return C.events.length?`<div class="grid">${C.events.map((e,i)=>evCard(e,i)).join("")}</div>`:empty("No upcoming events","Upcoming events will be announced here.")}
function evCard(e,i){return `<article class="card"><span class="tag">${esc(e.cat)}</span><h3><a href="#/event/${i}">${esc(e.title)}</a></h3><p>${esc(e.date)} · ${esc(e.time)}<br>${esc(e.location)}</p></article>`}
function sermCard(s,i){return `<article class="card"><span class="tag">${esc(s.topic)}</span><h3><a href="#/sermon/${i}">${esc(s.title)}</a></h3><p>${esc(s.speaker)} · ${fmt(s.date)}<br>${esc(s.scripture)}</p></article>`}
function form(id,fields,btn){return `<form id="${id}" novalidate>${fields}<div class="hp" aria-hidden="true"><label>Leave empty<input name="website" tabindex="-1" autocomplete="off"></label></div><p class="err" id="${id}e" role="alert"></p><button class="btn dk" type="submit">${btn}</button><div id="${id}o" aria-live="polite"></div></form>`}
function wire(id){const f=document.getElementById(id);if(!f)return;f.addEventListener("submit",e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f)),er=document.getElementById(id+"e");er.textContent="";
 if(d.website)return;
 if(f.message&&!d.message.trim()){er.textContent="Please enter your "+(id==="pf"?"prayer request":"message")+".";f.message.focus();return}
 if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)){er.textContent="Please enter a valid email address, or leave it blank.";f.email.focus();return}
 if(id==="cf"&&!d.email){er.textContent="Please enter your email address so we can reply.";f.email.focus();return}
 document.getElementById(id+"o").innerHTML=`<div class="ok"><b>Thank you. Your details passed validation.</b><br>This site is not yet connected to a mailbox or database, so nothing has been sent or stored. The church team must connect a form service before publishing. For now, please call ${C.phones[0]}.</div>`;f.reset()})}

const pages={
"":()=>["Christ-Like Evangelistic Ministry | Church in Tottenham",`
<div class="hero"><div class="wrap fade"><h1>WELCOME TO CHRIST-LIKE EVANGELISTIC MINISTRY</h1>
<p class="sub">A place to encounter Christ, grow in faith, and live a life that reflects His love.</p>
<div class="cta"><a class="btn" href="#/visit">Join us this Sunday</a><a class="btn ghost" href="#/sermons">Watch a sermon</a></div>
<div class="svcbox"><b>SUNDAY WORSHIP SERVICE</b><br>${C.day}<br>${C.time}<br>The Pavilion, Selby Center<br>Selby Road, Tottenham, N17 8JL</div>
<span class="scroll" aria-hidden="true"></span></div></div>
<section><div class="wrap split"><div><h2>YOU ARE WELCOME HERE</h2><p>At Christ-Like Evangelistic Ministry, we believe that everyone can encounter the love of God, grow in His Word, and discover their purpose. Whether you are visiting for the first time or looking for a church family, you are welcome among us.</p><a class="btn dk" href="#/about">Discover our ministry</a></div>${ph("Congregation worshipping together","tall")}</div></section>
<section class="alt"><div class="wrap split"><div><h2>JOIN US FOR WORSHIP</h2><p>Come and join us for a time of worship, prayer, fellowship, teaching, and encouragement in God's Word.</p></div>${svc()}</div></section>
<section><div class="wrap"><h2>Your first visit</h2><p>We would be delighted to welcome you. Join us every Sunday from 3:30 PM to 5:30 PM at The Pavilion, Selby Center, Selby Road, Tottenham, N17 8JL.</p><a class="btn dk" href="#/visit">Plan your visit</a></div></section>
<section class="alt"><div class="wrap"><h2>Upcoming events</h2>${upcoming()}</div></section>
<section><div class="wrap split"><div><h2>We would love to pray with you</h2><p>Whatever you are facing, you do not have to face it alone.</p><a class="btn dk" href="#/prayer">Request prayer</a></div>${ph("People praying together")}</div></section>`],

about:()=>["About Us | Christ-Like Evangelistic Ministry Tottenham",head("ABOUT CHRIST-LIKE EVANGELISTIC MINISTRY",C.intro)+`
<section><div class="wrap grid"><div><h2>OUR STORY</h2><p class="ph-txt">${C.story}</p></div><div><h2>OUR MISSION</h2><p class="ph-txt">${C.mission}</p></div><div><h2>OUR VISION</h2><p class="ph-txt">${C.vision}</p></div></div></section>
<section class="alt"><div class="wrap"><h2>OUR VALUES</h2><div class="grid">${C.values.map(v=>`<div class="card"><h3>${v[0]}</h3><p>${v[1]}</p></div>`).join("")}</div></div></section>
<section><div class="wrap split"><div><h2>MEET OUR PASTOR</h2><h3>${C.pastor}</h3><p><b>Pastor</b></p><p class="ph-txt">${C.bio}</p><a class="btn dk" href="#/about/message">Read pastor's message</a></div>${ph("Portrait of "+C.pastor,"tall")}</div></section>
<section class="alt" id="message"><div class="wrap split">${ph("Portrait of "+C.pastor)}<div><h2>A WORD FROM OUR PASTOR</h2><p class="ph-txt">${C.message}</p><p><b>${C.pastor}</b></p></div></div></section>`],

services:()=>["Services | Christ-Like Evangelistic Ministry",head("WORSHIP WITH US")+`
<section><div class="wrap split"><div><h2>SUNDAY WORSHIP SERVICE</h2><p><b>${C.day}</b><br>${C.time}</p><p>${C.addr.slice(0,5).join("<br>")}</p><p>Come and join us for a time of worship, prayer, fellowship, teaching, and encouragement in God's Word.</p></div>${svc()}</div></section>
<section class="alt"><div class="wrap"><h2>Other gatherings</h2><p>Details will be added once confirmed by the church.</p><div class="grid">${C.extraServices.map(s=>`<div class="card"><h3>${s[0].toUpperCase()}</h3><p class="ph-txt">[Add schedule and details]</p></div>`).join("")}</div></div></section>
<section><div class="wrap"><h2>WORSHIP WITH US ONLINE</h2><p><span class="live"><span class="dot"></span>${C.liveUrl?"Live":"Offline"}</span></p>${C.liveUrl?`<div class="stream"><iframe src="${esc(C.liveUrl)}" title="Live service" style="width:100%;height:100%;border:0" allowfullscreen></iframe></div>`:`<div class="stream"><div><h3>NO LIVE SERVICE RIGHT NOW</h3><p style="margin:0 auto">Our next online service will appear here.</p></div></div>`}</div></section>`],

sermons:()=>["Sermons | Christ-Like Evangelistic Ministry",head("SERMONS","Grow in God's Word wherever you are.")+`<section><div class="wrap"><div class="filters"><input id="q" type="search" placeholder="Search sermons" aria-label="Search sermons"><select id="t" aria-label="Filter by topic"><option value="">All topics</option>${C.topics.map(t=>`<option>${t}</option>`).join("")}</select><select id="sp" aria-label="Filter by speaker"><option value="">All speakers</option>${[...new Set(C.sermons.map(s=>s.speaker))].map(t=>`<option>${esc(t)}</option>`).join("")}</select><select id="d" aria-label="Sort by date"><option value="n">Newest first</option><option value="o">Oldest first</option></select></div><div id="sl"></div></div></section>`,()=>{
 const run=()=>{const q=$("q").value.toLowerCase(),t=$("t").value,sp=$("sp").value;let l=C.sermons.map((s,i)=>[s,i]).filter(([s])=>(!t||s.topic===t)&&(!sp||s.speaker===sp)&&(s.title+s.scripture+s.desc+s.speaker).toLowerCase().includes(q)).sort((a,b)=>a[0].date<b[0].date?1:-1);if($("d").value==="o")l.reverse();
  $("sl").innerHTML=l.length?`<div class="grid">${l.map(([s,i])=>sermCard(s,i)).join("")}</div>`:empty("NO SERMONS AVAILABLE YET","New sermons will appear here soon.")};
 ["q","t","sp","d"].forEach(i=>$(i).addEventListener("input",run));run()}],

events:()=>["Events | Christ-Like Evangelistic Ministry",head("EVENTS","Gatherings, prayer, outreach and community.")+`<section><div class="wrap"><p>${C.eventCats.map(c=>`<span class="tag">${c}</span>`).join("")}</p>${C.events.length?upcoming():empty("NO UPCOMING EVENTS","Please check back for upcoming ministry events.")}</div></section>`],

ministries:()=>["Ministries | Christ-Like Evangelistic Ministry",head("MINISTRIES","Details are added as each ministry is confirmed by the church.")+`<section><div class="wrap grid">${C.ministries.map((m,i)=>`<article class="card"><h3><a href="#/ministry/${i}">${esc(m.name)}</a></h3><p class="ph-txt">${esc(m.desc)}</p></article>`).join("")}</div></section>`],

prayer:()=>["Prayer Requests | Christ-Like Evangelistic Ministry",head("WE WOULD LOVE TO PRAY WITH YOU","Whatever you are facing, you do not have to face it alone. Share your prayer request with us and our ministry team can pray with you.")+`<section><div class="wrap" style="max-width:680px">${form("pf",`<label for="pn">Name (optional)</label><input id="pn" name="name" autocomplete="name"><label for="pe">Email (optional)</label><input id="pe" name="email" type="email" autocomplete="email"><label for="pm">Prayer request</label><textarea id="pm" name="message" required></textarea><fieldset style="border:0;padding:0;margin:16px 0 0"><legend style="font-weight:600">Would you like someone to contact you?</legend><label style="font-weight:400;display:inline-block;margin-right:20px"><input type="radio" name="contact" value="Yes" style="width:auto;min-height:0"> Yes</label><label style="font-weight:400;display:inline-block"><input type="radio" name="contact" value="No" checked style="width:auto;min-height:0"> No</label></fieldset>`,"Submit prayer request")}<p style="margin-top:20px;color:var(--mute);font-size:.95rem"><b>Privacy:</b> Prayer requests are never posted publicly. Share only what you are comfortable sharing. See our <a href="#/privacy">Privacy Policy</a>.</p></div></section>`,()=>wire("pf")],

give:()=>["Give | Christ-Like Evangelistic Ministry",head("GIVE","Your generosity helps support the ministry, outreach, discipleship, worship, and service to our community.")+`<section><div class="wrap"><div class="grid">${C.giving.map(g=>`<div class="card"><h3>${g[0].toUpperCase()}</h3><p class="ph-txt">${esc(g[1])}</p></div>`).join("")}</div><p style="margin-top:24px;color:var(--mute)">For your security, only give through details published by the church on this page or confirmed in person. If unsure, call ${C.phones[0]}.</p></div></section>`],

contact:()=>["Contact | Christ-Like Evangelistic Ministry",head("GET IN TOUCH")+`<section><div class="wrap split"><div><h2>${C.name}</h2><h3>Address</h3><p>${C.addr.join("<br>")}</p><h3>Phone</h3><p>${C.phones.map(tel).join("<br>")}</p><h3>Email</h3><p class="ph-txt">${C.email}</p><h3>Sunday Service</h3><p>${C.day}<br>${C.time}</p>
<div class="row"><a class="btn dk" href="tel:${C.phones[0].replace(/\s/g,"")}">Call us</a><a class="btn ghost" style="color:var(--ink)" href="${dirUrl}" target="_blank" rel="noopener">Get directions</a><a class="btn ghost" style="color:var(--ink)" href="#/contact" onclick="event.preventDefault();$('cn').focus()">Send a message</a></div></div>
<div id="sm">${form("cf",`<label for="cn">Name</label><input id="cn" name="name" autocomplete="name"><label for="ce">Email</label><input id="ce" name="email" type="email" autocomplete="email"><label for="cm">Message</label><textarea id="cm" name="message" required></textarea>`,"Send message")}</div></div></section>
<section class="alt"><div class="wrap"><h2>FIND US</h2><iframe class="map" title="Map of The Pavilion, Selby Center, Tottenham" loading="lazy" src="https://www.google.com/maps?q=${encodeURIComponent(C.addr.join(", "))}&output=embed"></iframe><p style="margin-top:12px"><a href="${dirUrl}" target="_blank" rel="noopener">Open in Google Maps</a></p></div></section>`,()=>wire("cf")],

visit:()=>["Your First Visit | Christ-Like Evangelistic Ministry",head("YOUR FIRST VISIT","Planning your first visit? We would be delighted to welcome you.")+`<section><div class="wrap split"><div><h2>What to expect</h2><p>Join us every Sunday from 3:30 PM to 5:30 PM at The Pavilion, Selby Center, Selby Road, Tottenham, N17 8JL. Our services include worship, prayer, fellowship, teaching, and encouragement in God's Word.</p><p class="ph-txt">[Add details: parking, dress, children, what happens during the service.]</p><p>Questions before you come? Call ${C.phones.map(tel).join(" or ")}.</p></div>${svc()}</div></section>`],

privacy:()=>["Privacy Policy | Christ-Like Evangelistic Ministry",head("PRIVACY POLICY")+`<section><div class="wrap"><p>This page explains how information sent through our contact forms, prayer requests, event registration and giving-related forms is handled.</p><p>Prayer requests are not published. Only the information you choose to enter is collected, and we aim to collect no more than is needed to respond.</p><p class="ph-txt">[Add: who receives submissions, how long they are kept, how to request deletion, and the church's data-protection contact. Have this reviewed before publishing.]</p></div></section>`],
terms:()=>["Website Disclaimer | Christ-Like Evangelistic Ministry",head("TERMS / WEBSITE DISCLAIMER")+`<section><div class="wrap"><p>Information on this website is provided for general guidance about the ministry and may change. Please confirm details by phone.</p><p class="ph-txt">[Add the church's official terms and disclaimer here.]</p></div></section>`]
};
const $=i=>document.getElementById(i);
function detail(kind,i){
 if(kind==="sermon"){const s=C.sermons[i];if(!s)return null;return[s.title,head(esc(s.title),`${esc(s.speaker)} · ${fmt(s.date)} · ${esc(s.scripture)}`)+`<section><div class="wrap"><div class="stream">${s.video?`<video controls src="${esc(s.video)}" style="width:100%;height:100%"></video>`:"<p>The video will appear here.</p>"}</div>${s.audio?`<p><audio controls src="${esc(s.audio)}" style="width:100%"></audio></p>`:""}<p style="margin-top:20px">${esc(s.desc)}</p><a href="#/sermons">Back to sermons</a></div></section>`]}
 if(kind==="event"){const e=C.events[i];if(!e)return null;return[e.title,head(esc(e.title),`${esc(e.date)} · ${esc(e.time)} · ${esc(e.location)}`)+`<section><div class="wrap"><p>${esc(e.desc||"")}</p>${e.register?`<a class="btn dk" href="${esc(e.register)}" rel="noopener">Register</a>`:""}<p><a href="#/events">Back to events</a></p></div></section>`]}
 if(kind==="ministry"){const m=C.ministries[i];if(!m)return null;return[m.name,head(esc(m.name))+`<section><div class="wrap split"><div><p class="ph-txt">${esc(m.desc)}</p><p><b>Leader:</b> ${esc(m.leader)}<br><b>Meets:</b> ${esc(m.schedule)}<br><b>Contact:</b> ${esc(m.contact)}</p><a href="#/ministries">Back to ministries</a></div>${ph(m.name+" photo")}</div></section>`]}
}
function route(){
 const parts=(location.hash.replace(/^#\/?/,"")).split("/"),key=parts[0];let r;
 if(["sermon","event","ministry"].includes(key))r=detail(key,+parts[1]);else r=pages[key]&&pages[key]();
 if(!r)r=["Page not found",head("PAGE NOT FOUND")+`<section><div class="wrap"><p>We could not find that page.</p><a class="btn dk" href="#/">Return home</a></div></section>`];
 document.title=r[0];$("main").innerHTML=r[1];if(r[2])r[2]();
 if(key==="about"&&parts[1]==="message")$("message").scrollIntoView();else window.scrollTo(0,0);
 document.querySelectorAll("#navl a").forEach(a=>a.getAttribute("href")==="#/"+key?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
 $("nav").classList.remove("open");document.querySelector(".menu").setAttribute("aria-expanded","false");
}
$("navl").innerHTML=nav.map(n=>`<li><a href="#/${n[0]}">${n[1]}</a></li>`).join("")+`<li><a class="btn" href="#/visit" style="color:#1A1608;margin-left:8px">Join us</a></li>`;
document.querySelector(".menu").onclick=e=>{const o=$("nav").classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",o)};
const soc=Object.entries(C.social).filter(s=>s[1]).map(s=>`<li><a href="${esc(s[1])}" rel="noopener" target="_blank">${s[0]}</a></li>`).join("");
$("foot").innerHTML=`<div class="grid"><div><h3>${C.name}</h3><p>${C.tagline}</p></div><div><p>${addrLine}</p><p>${C.phones.map(tel).join("<br>")}</p><p>Sundays | ${C.time}</p></div><div><ul>${nav.map(n=>`<li><a href="#/${n[0]}">${n[1].replace(" Us","")}</a></li>`).join("")}</ul></div><div><ul><li><a href="#/visit">First visit</a></li><li><a href="#/privacy">Privacy policy</a></li><li><a href="#/terms">Website disclaimer</a></li>${soc}</ul></div></div><div class="fb">© ${new Date().getFullYear()} CHRIST-LIKE EVANGELISTIC MINISTRY. ALL RIGHTS RESERVED.</div>`;
addEventListener("hashchange",route);route();
</script>
</body>
</html>
